<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VIVANT最終話まで</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: linear-gradient(160deg, #14100f 0%, #241114 55%, #170d12 100%);
    color: #f5efe9;
    font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Noto Sans JP", sans-serif;
    padding: 24px;
    text-align: center;
  }
  .label {
    letter-spacing: .35em;
    font-size: .8rem;
    color: #e8b4b8;
    margin-bottom: 14px;
  }
  h1 {
    font-size: clamp(1.9rem, 7vw, 3.4rem);
    font-weight: 800;
    letter-spacing: .08em;
    margin-bottom: 10px;
  }
  h1 .accent { color: #e63946; }
  .target { color: #cdbfb8; font-size: .95rem; margin-bottom: 42px; }
  .timer {
    font-size: clamp(3rem, 14vw, 6rem);
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    letter-spacing: .04em;
    line-height: 1.1;
  }
  .timer-cap { margin-top: 12px; font-size: .75rem; letter-spacing: .3em; color: #e8b4b8; }
  .done {
    display: none;
    font-size: clamp(1.6rem, 6vw, 2.6rem);
    font-weight: 800;
    color: #ffb3ba;
    letter-spacing: .06em;
  }
  footer { margin-top: 48px; color: #8d7d76; font-size: .75rem; letter-spacing: .15em; }
</style>
</head>
<body>
  <div class="label">COUNTDOWN</div>
  <h1>VIVANT<span class="accent">最終話</span>まで</h1>
  <p class="target">2026年11月8日（日）21:00 放送開始</p>

  <div class="timer" id="timer">00:00:00</div>
  <div class="timer-cap" id="timerCap">時間 : 分 : 秒</div>
  <div class="done" id="done">最終話、放送中！</div>

  <footer>VIVANT 最終話カウントダウン</footer>

<script>
  const target = new Date('2026-11-08T21:00:00+09:00').getTime();
  const timerEl = document.getElementById('timer');
  const capEl = document.getElementById('timerCap');
  const doneEl = document.getElementById('done');
  function pad(n){ return String(n).padStart(2, '0'); }
  function tick(){
    const diff = target - Date.now();
    if (diff <= 0) {
      timerEl.style.display = 'none';
      capEl.style.display = 'none';
      doneEl.style.display = 'block';
      document.title = 'VIVANT最終話 放送中！';
      return;
    }
    const sec = Math.floor(diff / 1000);
    timerEl.textContent = pad(Math.floor(sec / 3600)) + ':' + pad(Math.floor(sec % 3600 / 60)) + ':' + pad(sec % 60);
    setTimeout(tick, 250);
  }
  tick();
</script>
</body>
</html>
